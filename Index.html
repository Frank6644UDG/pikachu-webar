<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba WebAR - ¡Atrópalos a todos!</title>
  
  <!-- Librerías de 3D (A-Frame) y WebAR (MindAR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Capa de la silueta/guía sobre la cámara */
    #guia-encuadre {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.15);
      transition: opacity 0.5s ease;
    }
    
    #cuadro-silueta {
      width: 70vw;
      height: 70vw;
      max-width: 320px;
      max-height: 320px;
      border: 3px dashed #ffffff;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    #texto-instruccion {
      color: #ffffff;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      text-align: center;
    }

    .oculto {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Target-Lost / Sticky AR: Mensaje secundario en pantalla si se pierde el objetivo */
    #mensaje-pantalla {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffcc00;
      color: #000000;
      padding: 14px 28px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- 1. Guía de Encuadre (Silueta 2D) -->
  <div id="guia-encuadre">
    <div id="cuadro-silueta"></div>
    <div id="texto-instruccion">Apunta tu cámara hacia la foto</div>
  </div>

  <!-- 2. Sticky AR / Banner en Pantalla (Fallback al desenfocar) -->
  <div id="mensaje-pantalla">¡Atrópalos a todos!</div>

  <!-- 3. Escena AR en 3D -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Ancla asociada a tu foto procesada -->
    <a-entity id="target-objetivo" mindar-image-target="targetIndex: 0">
      
      <!-- Fondo/Plano 3D para darle estilo al texto -->
      <a-plane position="0 0 0" width="1.2" height="0.4" color="#ffcc00" material="transparent: true; opacity: 0.95;"></a-plane>

      <!-- Texto flotante en 3D sobre el objetivo -->
      <a-text 
        value="¡Atropalos a todos!" 
        color="#000000" 
        align="center" 
        position="0 0 0.05" 
        width="3"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
      </a-text>

    </a-entity>

  </a-scene>

  <script>
    const targetObjetivo = document.querySelector('#target-objetivo');
    const guiaEncuadre = document.querySelector('#guia-encuadre');
    const mensajePantalla = document.querySelector('#mensaje-pantalla');

    // Evento A: Se reconoce la foto objetivo
    targetObjetivo.addEventListener("targetFound", () => {
      // Oculta la silueta de encuadre
      guiaEncuadre.classList.add("oculto");
      // Muestra el banner fijo en pantalla (Sticky AR)
      mensajePantalla.style.display = "block";
    });

    // Evento B: Se pierde de vista la foto
    targetObjetivo.addEventListener("targetLost", () => {
      // Vuelve a mostrar la guía de encuadre si el usuario desenfoca
      guiaEncuadre.classList.remove("oculto");
    });
  </script>
</body>
</html>
