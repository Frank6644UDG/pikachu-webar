<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor WebAR - Experiencia Cultural</title>

  <!-- Librerías de Realidad Aumentada -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }

    /* 1. Capa de Silueta Guía de Encuadre */
    #guia-encuadre {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      transition: opacity 0.5s ease;
    }

    #imagen-silueta-png {
      width: 65vw;
      max-width: 280px;
      height: auto;
      opacity: 0.8;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }

    #texto-instruccion {
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      margin-top: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      text-align: center;
    }

    /* 2. Tarjeta / Banner Flotante Paginado (Sticky 2D) */
    #card-info-paginada {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85vw;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      color: #111;
      padding: 18px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      display: none; /* Se activa cuando termina el video */
      z-index: 1000;
      box-sizing: border-box;
      animation: fadeInUp 0.4s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge-pagina {
      background: #007bff;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .card-titulo {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #111;
    }

    .card-texto {
      font-size: 14px;
      line-height: 1.45;
      color: #333;
      margin: 8px 0 16px 0;
      min-height: 50px;
    }

    .btn-cat {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-cat:hover { background: #218838; }

    .oculto { opacity: 0 !important; pointer-events: none !important; }
  </style>
</head>
<body>

  <!-- Capa con Silueta Guía -->
  <div id="guia-encuadre">
    <img id="imagen-silueta-png" src="./2.png" alt="Silueta de alineación">
    <div id="texto-instruccion">Alinea la cámara con el objetivo</div>
  </div>

  <!-- Tarjeta Paginada 2D que aparece tras el video -->
  <div id="card-info-paginada">
    <div class="card-header">
      <h3 class="card-titulo" id="info-titulo">Hachiko (Estatua de Ueno)</h3>
      <span class="badge-pagina" id="badge-paso">Página 1/2</span>
    </div>
    <p class="card-texto" id="info-contenido">Cargando traducción...</p>
    <button class="btn-cat" id="btn-siguiente" onclick="avanzarPagina()">
      Siguiente <span id="flecha-cat">➔</span>
    </button>
  </div>

  <!-- Escena A-Frame / MindAR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- Carga de Recursos Multimedia -->
    <a-assets>
      <!-- Video corto de 5s o animación pre-renderizada -->
      <video id="video-intro" src="./intro.mp4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video>
      <!-- Canción o Audio Temático de Fondo -->
      <audio id="audio-fondo" src="./audio.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objetivo WebAR -->
    <a-entity id="target-objetivo" mindar-image-target="targetIndex: 0">
      <!-- Reproductor del Video sobre el Plano 3D AR -->
      <a-video 
        src="#video-intro" 
        width="1.2" 
        height="0.8" 
        position="0 0 0" 
        rotation="0 0 0">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    // 1. DICCIONARIO MULTILENGUAJE (I18N AUTOMÁTICO)
    const diccionarios = {
      es: {
        instruccion: "Alinea la cámara con la placa de la estatua",
        titulo: "Estatua de Hachiko (Ueno)",
        paginas: [
          "Hachiko fue un perro japonés recordado por su asombrosa lealtad a su dueño, el profesor Hidesaburo Ueno, a quien esperó diariamente durante años.",
          "Esta estatua rinde homenaje a su conmovedor reencuentro en el campus de la Universidad de Tokio, celebrando la fidelidad eterna."
        ],
        btnPaso1: "Ver más historia ➔",
        btnPaso2: "Entendido ✔"
      },
      en: {
        instruccion: "Align camera with the statue plaque",
        titulo: "Hachiko Statue (Ueno)",
        paginas: [
          "Hachiko was a Japanese dog remembered for his remarkable loyalty to his owner, Professor Hidesaburo Ueno, whom he waited for daily for years.",
          "This statue commemorates their heartwarming reunion at the University of Tokyo campus, celebrating everlasting fidelity."
        ],
        btnPaso1: "Read more ➔",
        btnPaso2: "Got it ✔"
      },
      ja: {
        instruccion: "プレートにカメラを合わせてください",
        titulo: "ハチ公像（上野）",
        paginas: [
          "忠犬ハチ公は、飼い主である上野英三郎教授への深い忠誠心で知られる有名な秋田犬です。",
          "この像は東京大学キャンパスでの感動的な再会を象徴し、永遠の絆を称えています。"
        ],
        btnPaso1: "次へ ➔",
        btnPaso2: "了解 ✔"
      }
    };

    // 2. DETECCIÓN DE IDIOMA DEL DISPOSITIVO
    const userLang = (navigator.language || navigator.userLanguage || 'es').substring(0, 2);
    const textLang = diccionarios[userLang] ? diccionarios[userLang] : diccionarios['en']; // Fallback a inglés

    // Elementos del DOM
    const targetObjetivo = document.querySelector('#target-objetivo');
    const guiaEncuadre = document.querySelector('#guia-encuadre');
    const textoInstruccion = document.querySelector('#texto-instruccion');
    const imgSilueta = document.querySelector('#imagen-silueta-png');
    
    const cardInfo = document.querySelector('#card-info-paginada');
    const infoTitulo = document.querySelector('#info-titulo');
    const infoContenido = document.querySelector('#info-contenido');
    const badgePaso = document.querySelector('#badge-paso');
    const btnSiguiente = document.querySelector('#btn-siguiente');

    const videoIntro = document.querySelector('#video-intro');
    const audioFondo = document.querySelector('#audio-fondo');

    let paginaActual = 0;

    // Configurar idioma inicial
    textoInstruccion.innerText = textLang.instruccion;
    infoTitulo.innerText = textLang.titulo;

    // Cargar silueta desde Admin si existe localmente
    const siluetaGuardada = localStorage.getItem('silueta_custom_png');
    if (siluetaGuardada && siluetaGuardada.trim() !== "") {
      imgSilueta.src = siluetaGuardada;
    }

    // 3. RECONOCIMIENTO Y REPRODUCCIÓN (targetFound)
    targetObjetivo.addEventListener("targetFound", () => {
      // Ocultar la silueta
      guiaEncuadre.classList.add("oculto");

      // Iniciar animación de video y audio
      if (videoIntro) {
        videoIntro.currentTime = 0;
        videoIntro.play();
      }
      if (audioFondo) {
        audioFondo.currentTime = 0;
        audioFondo.play();
      }
    });

    // 4. AL TERMINAR EL VIDEO (5 seg) -> MOSTRAR TARJETA CON TEXTO TRADUCIDO
    videoIntro.addEventListener('ended', () => {
      mostrarPagina(0);
      cardInfo.style.display = "block";
    });

    // Si pierden la cámara
    targetObjetivo.addEventListener("targetLost", () => {
      guiaEncuadre.classList.remove("oculto");
    });

    // 5. NAVEGACIÓN Y PAGINACIÓN DEL TEXTO
    function mostrarPagina(index) {
      paginaActual = index;
      infoContenido.innerText = textLang.paginas[paginaActual];
      badgePaso.innerText = `Página ${paginaActual + 1}/2`;

      if (paginaActual === 0) {
        btnSiguiente.innerText = textLang.btnPaso1;
      } else {
        btnSiguiente.innerText = textLang.btnPaso2;
      }
    }

    function avanzarPagina() {
      if (paginaActual === 0) {
        mostrarPagina(1);
      } else {
        // Al terminar de leer la página 2, se oculta suavemente la tarjeta
        cardInfo.style.display = "none";
      }
    }
  </script>
</body>
</html>
