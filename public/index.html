<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor WebAR - Experiencia Cultural</title>

  <!-- Librerías de Realidad Aumentada -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }

    /* 1. Modal / Pop-up de Pregunta Inicial (Sticky AR) */
    #modal-sticky {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal-card h3 { margin-top: 0; color: #111; font-size: 20px; }
    .modal-card p { color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }

    .modal-btn-group { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-si { background: #007bff; color: white; }
    .btn-no { background: #e0e0e0; color: #333; }

    /* 2. Capa de Silueta Guía de Encuadre */
    #guia-encuadre {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      transition: opacity 0.5s ease;
    }

    #imagen-silueta-png {
      width: 65vw;
      max-width: 280px;
      height: auto;
      opacity: 0.8;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }

    #texto-instruccion {
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      margin-top: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      text-align: center;
    }

    /* 3. Tarjeta / Banner Flotante Paginado (2D / Sticky AR) */
    #card-info-paginada {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85vw;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      color: #111;
      padding: 18px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      display: none; /* Se activa cuando termina el video */
      z-index: 1000;
      box-sizing: border-box;
      animation: fadeInUp 0.4s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
