<script>
  let siluetaBase64 = "";

  function irAPaso(numeroPaso) {
    if (numeroPaso === 2) {
      const inputSilueta = document.getElementById('foto-silueta');
      if (!inputSilueta.files[0] && !siluetaBase64) {
        alert("Por favor sube la foto de la silueta PNG antes de continuar.");
        return;
      }
    }

    document.querySelectorAll('.paso').forEach(p => p.classList.remove('activo'));
    document.querySelectorAll('.paso-dot').forEach(d => d.classList.remove('activo'));

    document.getElementById(`paso-${numeroPaso}`).classList.add('activo');
    document.getElementById(`dot-${numeroPaso}`).classList.add('activo');
  }

  function cargarVistaPreviaSilueta(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        siluetaBase64 = e.target.result;
        const imgPreview = document.getElementById('preview-silueta-img');
        imgPreview.src = siluetaBase64;
        imgPreview.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function actualizarTextoPreview(valor) {
    document.getElementById('preview-texto-box').innerText = valor || "Tu texto aquí";
  }

  async function finalizarConfiguracion() {
    const inputObjetivo = document.getElementById('foto-objetivo');
    const inputSilueta = document.getElementById('foto-silueta');
    const textoMensaje = document.getElementById('input-texto-mensaje').value;

    // Guardar preferencia de texto localmente
    localStorage.setItem('texto_mensaje_custom', textoMensaje);

    // Si el usuario seleccionó archivos para compilar en el servidor Node.js:
    if (inputObjetivo.files[0]) {
      const formData = new FormData();
      formData.append('fotoObjetivo', inputObjetivo.files[0]);
      if (inputSilueta.files[0]) {
        formData.append('fotoSilueta', inputSilueta.files[0]);
      }

      alert("Procesando objetivo en el servidor Node.js... Por favor espera unos segundos.");

      try {
        const respuesta = await fetch('/api/compile', {
          method: 'POST',
          body: formData
        });
        const resultado = await respuesta.json();

        if (resultado.success) {
          alert("¡Objetivo compilado con éxito en Render! Redirigiendo a la experiencia...");
          window.location.href = 'index.html';
        } else {
          alert("Error al compilar en el servidor: " + resultado.error);
        }
      } catch (error) {
        console.error(error);
        alert("Ocurrió un error al conectar con el servidor backend.");
      }
    } else {
      // Si no subió foto nueva, redirige directamente utilizando el archivo targets.mind por defecto
      alert("Configuración guardada. Redirigiendo...");
      window.location.href = 'index.html';
    }
  }
</script>
