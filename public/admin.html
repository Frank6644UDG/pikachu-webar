<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Targets Compiler - WebAR Panel</title>

  <!-- Carga de la versión de MindAR que utiliza el compilador web oficial -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 30px 20px;
      color: #212529;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 550px;
      width: 100%;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; font-size: 24px; font-weight: 700; color: #111; }
    p.subtitle { font-size: 14px; color: #6c757d; margin-bottom: 20px; }

    .dropzone {
      border: 2px dashed #00c49f;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      background: #f0fdf9;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .dropzone input { display: none; }
    .dropzone label { cursor: pointer; font-weight: 600; color: #00a884; }

    .form-group { margin-bottom: 18px; }
    label.title-label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; }
    
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .btn-start {
      width: 100%;
      background-color: #00c49f;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-start:hover { background-color: #00a884; }
    .btn-start:disabled { background-color: #a8e6cf; cursor: not-allowed; }

    #progress-status {
      margin-top: 15px;
      font-weight: 600;
      text-align: center;
      color: #008f7a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Image Targets Compiler</h2>
    <p class="subtitle">Select target image and customize your WebAR experience</p>

    <!-- Zona Cargar Foto Objetivo -->
    <div class="form-group">
      <label class="title-label">1. Foto Objetivo (JPG / PNG):</label>
      <div class="dropzone" onclick="document.getElementById('foto-objetivo').click()">
        <label id="label-objetivo">📁 Drop files here or click to upload</label>
        <input type="file" id="foto-objetivo" accept="image/*" onchange="mostrarNombreArchivo(this, 'label-objetivo')">
      </div>
    </div>

    <!-- Zona Cargar Silueta PNG -->
    <div class="form-group">
      <label class="title-label">2. Silueta Guía Encuadre (PNG Transparente):</label>
      <input type="file" id="foto-silueta" accept="image/png">
    </div>

    <!-- Mensaje Banner -->
    <div class="form-group">
      <label class="title-label">3. Texto Banner Flotante:</label>
      <input type="text" id="input-texto" value="¡Atrapalos a todos!">
    </div>

    <button class="btn-start" id="btn-start" onclick="iniciarCompilacionOficial()">Start & Publish ✔</button>

    <div id="progress-status"></div>
  </div>

  <script>
    function mostrarNombreArchivo(input, labelId) {
      if (input.files && input.files[0]) {
        document.getElementById(labelId).innerText = "📄 Imagen cargada: " + input.files[0].name;
      }
    }

    function cargarImagenDOM(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    async function iniciarCompilacionOficial() {
      const inputObj = document.getElementById('foto-objetivo');
      const inputSil = document.getElementById('foto-silueta');
      const textoMensaje = document.getElementById('input-texto').value;
      const btn = document.getElementById('btn-start');
      const status = document.getElementById('progress-status');

      if (!inputObj.files[0]) {
        alert("Por favor selecciona una imagen objetivo antes de iniciar.");
        return;
      }

      btn.disabled = true;
      status.innerText = "Inicializando motor de compilación oficial...";

      try {
        // Cargar la imagen cargada
        const imgElement = await cargarImagenDOM(inputObj.files[0]);

        // Iniciar el compilador oficial de MindAR (idéntico al de la web de la imagen)
        const compiler = new window.MINDAR.IMAGE.Compiler();

        status.innerText = "Compilando mapa de puntos... 0%";

        const dataList = await compiler.compileImageTargets([imgElement], (progress) => {
          status.innerText = `Compilando mapa de puntos... ${progress.toFixed(1)}%`;
        });

        status.innerText = "Generando archivo final .mind...";
        const exportedBuffer = await compiler.exportData();

        // Enviar resultado directamente a tu servidor Node.js en Render
        const formData = new FormData();
        const mindBlob = new Blob([exportedBuffer], { type: 'application/octet-stream' });
        formData.append('mindFile', mindBlob, 'targets.mind');

        if (inputSil.files[0]) {
          formData.append('fotoSilueta', inputSil.files[0]);
        }

        localStorage.setItem('texto_mensaje_custom', textoMensaje);

        status.innerText = "Guardando en servidor Render...";
        const res = await fetch('/api/compile', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          alert("¡Compilación exitosa! Redirigiendo a la experiencia WebAR...");
          window.location.href = 'index.html';
        } else {
          alert("Error en servidor: " + data.error);
          btn.disabled = false;
        }

      } catch (err) {
        console.error(err);
        alert("Error durante la compilación: " + err.message);
        btn.disabled = false;
        status.innerText = "";
      }
    }
  </script>
</body>
</html>
