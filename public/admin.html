<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración WebAR</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #111; font-size: 22px; }
    p.subtitulo { color: #666; font-size: 13px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 18px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 13px; color: #333; }
    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-compiler {
      display: block;
      background: #007bff;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      margin-top: 4px;
      transition: background 0.2s;
    }
    .btn-compiler:hover { background: #0056b3; }

    .btn-submit {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #218838; }
    .btn-submit:disabled { background: #82ce94; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Panel de Configuración WebAR</h2>
    <p class="subtitulo">Carga los recursos multimedia para tu experiencia AR.</p>

    <!-- Paso 1: Generar targets.mind -->
    <div class="form-group">
      <label>Paso 1: Generar mapa de puntos (.mind)</label>
      <a href="https://hiukim.github.io/mind-ar-js-doc/tools/compile" target="_blank" class="btn-compiler">
        🚀 Abrir Compilador Oficial de MindAR
      </a>
      <small style="color: #666;">Sube la foto de la placa ahí y descarga el archivo <code>targets.mind</code>.</small>
    </div>

    <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">

    <form id="form-config" onsubmit="guardarConfiguracion(event)">
      
      <!-- Archivo .mind -->
      <div class="form-group">
        <label for="input-mind">1. Archivo targets.mind compilado:</label>
        <input type="file" id="input-mind" accept=".mind" required>
      </div>

      <!-- Silueta PNG -->
      <div class="form-group">
        <label for="input-silueta">2. Silueta Guía de Encuadre (PNG Transparente):</label>
        <input type="file" id="input-silueta" accept="image/png">
      </div>

      <!-- Video de 5s -->
      <div class="form-group">
        <label for="input-video">3. Video de Animación AR (MP4 / WebM - Corto):</label>
        <input type="file" id="input-video" accept="video/mp4,video/webm">
      </div>

      <!-- Audio de Fondo -->
      <div class="form-group">
        <label for="input-audio">4. Audio / Canción de Fondo (MP3 / WAV):</label>
        <input type="file" id="input-audio" accept="audio/mp3,audio/wav">
      </div>

      <button type="submit" class="btn-submit" id="btn-save">Publicar Experiencia AR ✔</button>
    </form>
  </div>

  <script>
    async function guardarConfiguracion(e) {
      e.preventDefault();

      const mindFile = document.getElementById('input-mind').files[0];
      const siluetaFile = document.getElementById('input-silueta').files[0];
      const videoFile = document.getElementById('input-video').files[0];
      const audioFile = document.getElementById('input-audio').files[0];
      const btn = document.getElementById('btn-save');

      if (!mindFile) {
        alert("Por favor sube el archivo targets.mind generado.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Subiendo recursos a Render...";

      const formData = new FormData();
      formData.append('mindFile', mindFile);
      if (siluetaFile) formData.append('fotoSilueta', siluetaFile);
      if (videoFile) formData.append('videoFile', videoFile);
      if (audioFile) formData.append('audioFile', audioFile);

      try {
        const res = await fetch('/api/compile', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          alert("¡Todos los recursos se publicaron exitosamente! Redirigiendo...");
          window.location.href = 'index.html';
        } else {
          alert("Error en el servidor: " + data.error);
          btn.disabled = false;
          btn.innerText = "Publicar Experiencia AR ✔";
        }
      } catch (err) {
        alert("Error de conexión con el servidor en Render.");
        btn.disabled = false;
        btn.innerText = "Publicar Experiencia AR ✔";
      }
    }
  </script>
</body>
</html>
