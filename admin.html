<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Creador WebAR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
    }
    h2 { color: #333; margin-top: 0; }
    .form-group { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
    input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    
    /* Leyenda de advertencia para el PNG */
    .leyenda-advertencia {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      color: #856404;
      padding: 12px;
      font-size: 13px;
      margin-top: 8px;
      border-radius: 4px;
      line-height: 1.4;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background-color: #0056b3; }
    .status { margin-top: 15px; font-weight: bold; color: #28a745; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Configurador de Experiencia AR</h2>
    
    <!-- Campo 1: Imagen Objetivo -->
    <div class="form-group">
      <label for="foto-objetivo">1. Foto Objetivo (JPG / PNG):</label>
      <input type="file" id="foto-objetivo" accept="image/*">
    </div>

    <!-- Campo 2: Silueta PNG -->
    <div class="form-group">
      <label for="foto-silueta">2. Silueta Guía de Encuadre (PNG Transparente):</label>
      <input type="file" id="foto-silueta" accept="image/png">
      
      <!-- Leyenda solicitada -->
      <div class="leyenda-advertencia">
        ⚠️ <strong>Importante:</strong> La silueta debe ser el contorno recortado (con fondo transparente PNG) basado exactamente en la misma foto objetivo cargada en el paso 1.
      </div>
    </div>

    <button onclick="guardarConfiguracion()">Guardar y Probar Experiencia</button>
    <div id="mensaje-estado" class="status"></div>
  </div>

  <script>
    function guardarConfiguracion() {
      const inputObjetivo = document.getElementById('foto-objetivo');
      const inputSilueta = document.getElementById('foto-silueta');
      const mensaje = document.getElementById('mensaje-estado');

      if (!inputSilueta.files[0]) {
        alert("Por favor selecciona al menos el archivo PNG de la silueta.");
        return;
      }

      // Convertir la imagen PNG a formato Base64 para almacenarla localmente
      const reader = new FileReader();
      reader.onload = function(e) {
        localStorage.setItem('silueta_custom_png', e.target.result);
        mensaje.innerText = "¡Configuración guardada! Redirigiendo al visor...";
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      };
      
      reader.readAsDataURL(inputSilueta.files[0]);
    }
  </script>
</body>
</html>
