<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor WebAR - Experiencia Personalizada</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Capa para la Silueta PNG real */
    #guia-encuadre {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      transition: opacity 0.5s ease;
    }
    
    #imagen-silueta-png {
      width: 65vw;
      max-width: 300px;
      height: auto;
      opacity: 0.75;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }

    #texto-instruccion {
      color: #ffffff;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      text-align: center;
    }

    .oculto {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #mensaje-pantalla {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffcc00;
      color: #000000;
      padding: 14px 28px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Silueta dinámica cargada desde admin.html -->
  <div id="guia-encuadre">
    <img id="imagen-silueta-png" src="" alt="Silueta de alineación">
    <div id="texto-instruccion">Alinea la cámara con el objetivo</div>
  </div>

  <div id="mensaje-pantalla">¡Atrópalos a todos!</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-objetivo" mindar-image-target="targetIndex: 0">
      <a-plane position="0 0 0" width="1.2" height="0.4" color="#ffcc00" material="transparent: true; opacity: 0.95;"></a-plane>
      <a-text 
        value="¡Atropalos a todos!" 
        color="#000000" 
        align="center" 
        position="0 0 0.05" 
        width="3"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
      </a-text>
    </a-entity>

  </a-scene>

  <script>
    const targetObjetivo = document.querySelector('#target-objetivo');
    const guiaEncuadre = document.querySelector('#guia-encuadre');
    const mensajePantalla = document.querySelector('#mensaje-pantalla');
    const imgSilueta = document.querySelector('#imagen-silueta-png');

    // Cargar la silueta guardada desde el panel Admin
    const siluetaGuardada = localStorage.getItem('silueta_custom_png');
    if (siluetaGuardada) {
      imgSilueta.src = siluetaGuardada;
    }

    targetObjetivo.addEventListener("targetFound", () => {
      guiaEncuadre.classList.add("oculto");
      mensajePantalla.style.display = "block";
    });

    targetObjetivo.addEventListener("targetLost", () => {
      guiaEncuadre.classList.remove("oculto");
    });
  </script>
</body>
</html>
